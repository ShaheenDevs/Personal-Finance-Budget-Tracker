name: personal_finance_budget_tracker
description: An offline-first personal finance and budget tracker for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.5
  drift_dev: ^2.26.0
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
