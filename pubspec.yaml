name: personal_finance_budget_tracker
description: An offline-first personal finance and budget tracker for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  uuid: ^4.5.1
  cross_file: ^0.3.4+2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.5
  drift_dev: ^2.26.0
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
